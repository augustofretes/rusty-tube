[package]
name = "audio-app"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
ytmapi-rs = "0.3.2"
reqwest = { version = "0.11", features = ["cookies", "stream", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.19", features = ["symphonia-all"] }
ratatui = "0.26"
crossterm = "0.27"
directories = "5.0"
rookie = "0.5.6"

# macOS "Now Playing" / remote media controls (media keys, AirPods, Control Center).
[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8"
